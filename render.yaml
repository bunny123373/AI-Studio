# Render Blueprint - AI YouTube Studio
# Deploy: push this repo to GitHub, then on Render choose
#   "New +" -> "Blueprint" -> pick the repo. That's it.
# The free/starter plan has ~512MB RAM: Tool 3 (Whisper) works best on
# the Starter plan or higher.
services:
  - type: web
    name: ai-youtube-studio
    runtime: python
    plan: starter
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: |
      sudo apt-get update -qq && \
      sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra && \
      pip install -r requirements.txt && \
      pip install faster-whisper
    startCommand: python webapp.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render sets PORT itself; the app reads it from the environment.
      - key: AI_STUDIO_OUTPUT
        value: /opt/render/project/src/data/output
      - key: AI_STUDIO_RUNS
        value: /opt/render/project/src/data/runs
      # faster-whisper model cache lives on the same persistent disk,
      # so it downloads once instead of on every restart.
      - key: HF_HOME
        value: /opt/render/project/src/data/hf
    disk:
      name: studio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5